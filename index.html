<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Final 3D Weather App</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <h1>Final Super Ultra Realistic 3D Weather App</h1>

  <input type="text" id="apiKey" placeholder="Masukkan API Key OpenWeather">
  <input type="text" id="city" placeholder="Masukkan kota">
  <button id="checkBtn">Cek Cuaca</button>

  <div id="weather"></div>
  <div id="animation"></div>

  <!-- Suara cuaca -->
  <audio id="rainSound" loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
  </audio>
  <audio id="windSound" loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" type="audio/mpeg">
  </audio>
  <audio id="thunderSound" loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3" type="audio/mpeg">
  </audio>
</div>
<script src="script.js"></script>
</body>
</html>
