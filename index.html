<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xyraa Weather by Nico</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>🌎 Xyraa Weather</h1>
    <p class="subtitle">Cek kondisi cuaca di kota mana pun 🌤️</p>

    <div class="search-box">
      <input type="text" id="cityInput" placeholder="Masukkan nama kota...">
      <button onclick="getWeather()">Cek</button>
    </div>

    <div class="weather-card" id="weatherCard">
      <img id="weatherIcon" class="weather-icon" src="" alt="Weather Icon" style="display:none;">
      <h2 id="cityName"></h2>
      <p id="description"></p>
      <div class="temp-box">
        <h3 id="temperature"></h3>
      </div>
      <div class="details">
        <p id="wind"></p>
        <p id="humidity"></p>
      </div>
    </div>
  </div>

  <footer>© 2025 XyraaWeather by Nico</footer>
  <script src="script.js"></script>
</body>
</html>
