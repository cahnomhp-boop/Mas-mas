<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather Location</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <h1>☀️ Weater Location 🌙</h1>
  <p class="welcome-text">Selamat datang! Masukkan nama kota untuk melihat cuaca hari ini</p>

  <input type="text" id="city" placeholder="Masukkan kota">
  <button id="checkBtn">Cek Cuaca</button>

  <div id="weather">
    <h2>– – –</h2>
    <p>Cuaca akan muncul di sini</p>
  </div>

  <div id="animation"></div>

  <!-- Audio efek cuaca -->
  <audio id="rainSound" loop>
    <source src="WhatsApp Audio 2025-11-11 at 18.23.24.mpeg" type="audio/mpeg">
  </audio>
  <audio id="windSound" loop>
    <source src="WhatsApp Audio 2025-11-11 at 18.24.14.mpeg" type="audio/mpeg">
  </audio>
  <audio id="thunderSound" loop>
    <source src="WhatsApp Audio 2025-11-11 at 18.26.12.mpeg">
  </audio>
</div>

<script src="script.js"></script>
<script>
window.onload = function() {
  initDefaultAnimation(); // animasi cuaca awal
  const welcome = document.querySelector('.welcome-text');
  setTimeout(() => {
    welcome.classList.add('fade-in-slide'); // fade-in + slide
  }, 500);
};
</script>
</body>
</html>
