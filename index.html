<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Xyraa Weather</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="weather-app">
    <h1>🌈 Xyraa Weather</h1>
    <input type="text" id="cityInput" placeholder="Masukkan nama kota..." />
    <button onclick="getWeather()">Cek Cuaca</button>

    <div id="weatherResult" class="weather-card hidden">
      <h2 id="cityName"></h2>
      <img id="weatherIcon" alt="Ikon Cuaca" />
      <p id="description"></p>
      <p><strong>Suhu:</strong> <span id="temperature"></span>°C</p>
      <p><strong>Kelembapan:</strong> <span id="humidity"></span>%</p>
      <p><strong>Angin:</strong> <span id="wind"></span> m/s</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
