<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weater Location</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <h1>☀️ Weater Location 🌙</h1>
  <p class="welcome-text">Selamat datang! Masukkan kota untuk melihat cuaca!</p>

  <input type="text" id="city" placeholder="Masukkan kota">
  <button id="checkBtn">Cek Cuaca</button>

  <div id="weather">
    <h2>– – –</h2>
    <p>Cuaca akan muncul di sini</p>
  </div>
  <div id="animation"></div>

  <!-- Suara efek cuaca -->
  <audio id="rainSound" loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
  </audio>
  <audio id="windSound" loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" type="audio/mpeg">
  </audio>
  <audio id="thunderSound" loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3" type="audio/mpeg">
  </audio>
</div>
<script src="script.js"></script>
</body>
</html>
